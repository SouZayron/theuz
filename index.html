<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THEUZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ff1230;
    --red-deep:#8a0010;
    --red-hot:#ff5a6e;
    --ink:#050102;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden}
  body{
    background:var(--ink);
    font-family:'Zen Dots',sans-serif;
    color:#fff;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* Fundo: desce 10% e escurece 20% */
  .bg{
    position:fixed;left:0;right:0;
    top:-10vh;height:calc(100% + 10vh);
    background:url("https://xatimg.com/image/uCFkS723S29Z.png") center/cover no-repeat;
    transform:translateY(10vh);
    filter:brightness(.8);
    pointer-events:none;
  }

  /* Camadas de ambiente (red) */
  .tint{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(255,18,48,.28) 0%, rgba(120,0,16,.35) 40%, rgba(5,1,2,.78) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .glow{
    position:fixed;left:50%;top:52%;
    width:min(90vw,900px);height:min(60vh,520px);
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(255,18,48,.38), transparent 68%);
    filter:blur(40px);
    animation:breathe 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  .vignette{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%);
    pointer-events:none;
  }
  .scan{
    position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
    pointer-events:none;
    opacity:.55;
  }

  /* Palco central */
  .stage{
    position:relative;z-index:2;
    height:100%;width:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:clamp(8px,1.8vh,18px);
    padding:0 5vw;
    text-align:center;
  }

  /* Logo + reflexo passando */
  .logo{
    position:relative;
    width:clamp(70px,11vw,120px);
    aspect-ratio:1/1;
    flex:none;
    filter:drop-shadow(0 0 14px rgba(255,18,48,.7)) drop-shadow(0 6px 18px rgba(0,0,0,.6));
    animation:float 5s ease-in-out infinite;
  }
  .logo img{
    width:100%;height:100%;object-fit:contain;display:block;
  }
  .logo .shine{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:contain;display:block;
    filter:brightness(0) invert(1);
    opacity:.9;
    -webkit-mask-image:linear-gradient(115deg, transparent 40%, #000 50%, transparent 60%);
            mask-image:linear-gradient(115deg, transparent 40%, #000 50%, transparent 60%);
    -webkit-mask-size:300% 100%;mask-size:300% 100%;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:90% 0;mask-position:90% 0;
    animation:logoShine 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes logoShine{
    0%{-webkit-mask-position:90% 0;mask-position:90% 0}
    60%,100%{-webkit-mask-position:10% 0;mask-position:10% 0}
  }

  /* Nome com degradê interno animado + reflexo no chão */
  .name-wrap{
    position:relative;
    display:inline-block;
    line-height:1;
  }
  .name{
    font-family:'Zen Dots',sans-serif;
    font-weight:400;
    font-size:clamp(56px,14vw,170px);
    letter-spacing:-.02em;
    text-transform:uppercase;
    position:relative;
    display:inline-block;
    background:linear-gradient(90deg,
      #000 0%, #7a000e 25%, #ff1230 50%, #7a000e 75%, #000 100%);
    background-size:200% 100%;
    background-repeat:repeat-x;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:nameflow 9s linear infinite;
    filter:drop-shadow(0 0 6px #000) drop-shadow(0 0 16px rgba(0,0,0,.95)) drop-shadow(0 0 32px rgba(0,0,0,.8));
  }

  /* ID */
  .motto{
    margin-top:clamp(10px,2.4vh,22px);
    font-size:clamp(10px,1.9vw,18px);
    letter-spacing:.16em;
    color:#ffd6db;
    text-shadow:0 2px 3px #000, 0 0 8px #000, 0 0 16px rgba(0,0,0,.9);
    position:relative;z-index:3;
    max-width:92vw;
  }
  .motto .ch{
    display:inline-block;
    animation:letter 3s ease-in-out infinite;
    animation-delay:calc(var(--i) * .09s);
  }
  .motto .sp{display:inline-block;width:.5em}
  @keyframes letter{
    0%,60%,100%{transform:translateY(0);color:#ffd6db;text-shadow:0 2px 3px #000, 0 0 8px #000, 0 0 16px rgba(0,0,0,.9)}
    30%{transform:translateY(-5px);color:#ff1230;text-shadow:0 3px 4px #000, 0 0 10px #000, 0 0 20px rgba(0,0,0,.95)}
  }
  .id{
    position:relative;z-index:3;
    margin-top:clamp(2px,.6vh,8px);
    font-size:clamp(13px,2.2vw,22px);
    letter-spacing:.32em;
    padding:.7em 1.4em .7em 1.7em;
    border:1px solid rgba(255,18,48,.6);
    border-radius:999px;
    background:rgba(20,0,4,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#ffe3e6;
    text-shadow:0 0 10px rgba(255,18,48,.9);
    box-shadow:0 0 24px rgba(255,18,48,.3), inset 0 0 14px rgba(255,18,48,.15);
    animation:pulse 3s ease-in-out infinite;
  }

  /* Partículas vermelhas */
  .sparks{position:fixed;inset:0;pointer-events:none;z-index:1}
  .sparks i{
    position:absolute;bottom:-12px;
    width:var(--s);height:var(--s);
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px 2px rgba(255,18,48,.8);
    opacity:0;
    animation:rise var(--d) linear infinite;
    animation-delay:var(--t);
    left:var(--x);
  }

  @keyframes nameflow{from{background-position:0% 0}to{background-position:200% 0}}
  @keyframes sweepText{0%{background-position:200% 0}60%,100%{background-position:-100% 0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes breathe{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 24px rgba(255,18,48,.3), inset 0 0 14px rgba(255,18,48,.15)}50%{box-shadow:0 0 38px rgba(255,18,48,.55), inset 0 0 20px rgba(255,18,48,.25)}}
  @keyframes rise{
    0%{transform:translateY(0) scale(1);opacity:0}
    10%{opacity:.9}
    100%{transform:translateY(-105vh) scale(.4);opacity:0}
  }

  @media (max-height:520px){
    .logo{width:clamp(50px,9vh,80px)}
    .id{margin-top:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *:not(.name):not(.shine),*::before,*::after{animation:none!important}
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="tint"></div>
  <div class="glow"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
  <div class="sparks" id="sparks" aria-hidden="true"></div>

  <main class="stage">
    <div class="logo" id="logo">
      <img src="https://xatimg.com/image/j0TrpW5XhtDt.png" alt="Logo Flamengo" referrerpolicy="no-referrer">
      <img class="shine" src="https://xatimg.com/image/j0TrpW5XhtDt.png" alt="" aria-hidden="true" referrerpolicy="no-referrer">
    </div>

    <div class="name-wrap">
      <h1 class="name">THEUZ</h1>
    </div>

    <div class="id">ID: 106823856</div>

    <p class="motto">Uma vez Flamengo, sempre Flamengo</p>
  </main>

<script>
  // Frase: cada letra vira um span animado em onda
  (function(){
    const el = document.querySelector('.motto');
    const txt = el.textContent;
    el.setAttribute('aria-label', txt);
    el.textContent = '';
    [...txt].forEach((c,i)=>{
      const sp = document.createElement('span');
      sp.setAttribute('aria-hidden','true');
      sp.className = c === ' ' ? 'sp' : 'ch';
      sp.style.setProperty('--i', i);
      if(c !== ' ') sp.textContent = c;
      el.appendChild(sp);
    });
  })();

  // Partículas vermelhas subindo
  (function(){
    const box = document.getElementById('sparks');
    const n = window.innerWidth < 600 ? 18 : 34;
    for(let i=0;i<n;i++){
      const p = document.createElement('i');
      p.style.setProperty('--x', (Math.random()*100)+'%');
      p.style.setProperty('--s', (2+Math.random()*4)+'px');
      p.style.setProperty('--d', (6+Math.random()*8)+'s');
      p.style.setProperty('--t', (-Math.random()*12)+'s');
      box.appendChild(p);
    }
  })();
</script>
</body>
</html>
